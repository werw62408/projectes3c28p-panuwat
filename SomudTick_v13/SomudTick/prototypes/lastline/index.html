<style>
/* Layout: one column. A fake 128x32 OLED strip, the 320x240 game screen (drawn 2x), then two cards:
   camp = mission + loadout/arsenal/talents, battle = controls + live report. */
:root {
  --bg: #0d0a08;        /* ash */
  --panel: #17120e;     /* scorched steel */
  --line: #2e241b;
  --ink: #f1e6d6;
  --dim: #a08e79;
  --rust: #d2692a;      /* the accent: rusted metal / fire */
  --toxic: #a6e22e;
  --gold: #ffc857;
  --blood: #d8452f;
  --f-ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-num: "Orbitron", "Chakra Petch", "Segoe UI", sans-serif;
  --f-title: "Black Ops One", "Orbitron", sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 16px 28px; margin: 0; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
h1 { font-family: var(--f-title); font-weight: 400; font-size: clamp(26px, 4.6vw, 38px); letter-spacing: .06em; margin: 0; }
h1 span { color: var(--rust); }
.sub { color: var(--dim); font-size: 13px; letter-spacing: .04em; }
.oled { background: #000; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; font-family: var(--f-num); font-size: 13px; letter-spacing: .08em; color: #ffe0b8; display: flex; flex-wrap: wrap; gap: 4px 18px; font-variant-numeric: tabular-nums; min-height: 30px; align-items: center; text-shadow: 0 0 6px #ff9a4a88; }
.oled b { color: #fff; font-weight: 600; }
.screen { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; -webkit-user-select: none; user-select: none; }
canvas:focus-visible { outline: 2px solid var(--rust); outline-offset: -2px; }
.deck { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 12px; }
@media (max-width: 760px) { .deck { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.body { display: grid; gap: 10px; min-width: 0; }
button { font-family: var(--f-ui); font-size: 14px; color: var(--ink); background: #221a14; border: 1px solid #3d3026; border-radius: 6px; padding: 7px 10px; cursor: pointer; min-height: 38px; }
button:hover:not(:disabled) { border-color: var(--dim); }
button:focus-visible { outline: 2px solid var(--rust); outline-offset: 1px; }
button:disabled { opacity: .38; cursor: not-allowed; }
button.on { background: var(--rust); border-color: var(--rust); color: #1a0a02; font-weight: 700; }
.primary { background: var(--rust); color: #170800; border-color: var(--rust); font-weight: 700; letter-spacing: .06em; font-size: 15px; }
.primary:hover:not(:disabled) { border-color: #ffd0b0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row > .grow { flex: 1 1 auto; }
.seg { display: flex; flex-wrap: wrap; gap: 5px; }
.seg button { min-width: 42px; }
.note { font-size: 13px; color: #d6c7b4; }
.note strong { color: var(--ink); }
.note ul { margin: 4px 0 0; padding-left: 18px; }
.stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.stages button { display: grid; gap: 0; padding: 5px 4px; font-family: var(--f-num); font-size: 13px; }
.stages button small { font-family: var(--f-ui); font-size: 11px; color: var(--gold); letter-spacing: .05em; min-height: 1.2em; }
.stages button.sel { border-color: var(--rust); box-shadow: inset 0 0 0 1px var(--rust); }
.goals { display: grid; gap: 3px; font-size: 13px; }
.goals div.ok { color: var(--gold); }
.goals div:not(.ok) { color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--c, var(--dim)); color: var(--c, var(--dim)); }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 460px) { .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.slot { background: #100c09; border: 1px dashed #4a3a2c; border-radius: 6px; padding: 6px 8px; min-height: 52px; display: grid; align-content: center; gap: 1px; text-align: left; }
.slot.full { border-style: solid; border-color: var(--c); }
.slot span { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.slot b { font-size: 13.5px; color: var(--c, var(--dim)); font-weight: 600; }
.arsenal { display: grid; gap: 6px; }
.wpn { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; background: #100c09; border: 1px solid #2c2219; border-left: 3px solid var(--c); border-radius: 6px; padding: 6px 8px; }
.wpn.eq { background: #1f160f; border-color: var(--c); }
.wpn.lock { opacity: .5; border-left-color: #3d3026; }
.wpn .nm { font-weight: 600; font-size: 14px; }
.wpn .nm em { font-style: normal; font-family: var(--f-num); font-size: 11px; color: var(--gold); margin-left: 6px; }
.wpn .ds { grid-column: 1; font-size: 12px; color: var(--dim); }
.wpn .bt { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }
.wpn .bt button { min-height: 34px; font-size: 13px; padding: 5px 9px; }
.cost { font-family: var(--f-num); font-size: 11px; }
.scrap { font-family: var(--f-num); color: var(--gold); }
.tal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 460px) { .tal { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tal button { display: grid; gap: 1px; text-align: left; padding: 6px 8px; font-size: 13px; }
.tal button b { font-size: 13px; }
.tal button span { font-size: 11.5px; color: var(--dim); font-weight: 400; }
.tal button.on span { color: #3a1a06; }
.abil { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.abil button { display: grid; gap: 0; font-size: 13px; padding: 5px 6px; }
.abil button small { font-family: var(--f-num); font-size: 10.5px; color: var(--dim); }
.abil button.on small { color: #3a1a06; }
.keys { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font-size: 12.5px; color: #cdbda9; }
.keys kbd { font-family: var(--f-num); font-size: 10.5px; color: var(--ink); background: #0d0a08; border: 1px solid #3d3026; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.bar { display: grid; grid-template-columns: 7.6em minmax(0, 1fr) 4em; gap: 8px; align-items: center; font-size: 13px; }
.bar .track { height: 8px; background: #0d0a08; border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--c); }
.bar .v { text-align: right; font-family: var(--f-num); font-size: 11px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: #0d0a08; border-radius: 6px; padding: 7px 8px; }
.stat b { display: block; font-family: var(--f-num); font-size: 16px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10.5px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
.danger { background: #4a1a12; border-color: #7a2c1c; }
footer { color: var(--dim); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {
"use strict";
// ======================= the field (logical 320x240, drawn 2x) =======================
const W = 320, H = 240, TAU = Math.PI * 2;
const WALL_X = 50, LANE_T = 156, LANE_B = 222, SPAWN_X = 336, MUZ = { x: 35, y: 111 };
const SLOTS = [{ x: 44, y: 131 }, { x: 45, y: 158 }, { x: 44, y: 186 }];   // support mounts on the front of the wall
const DT = 1 / 60;

// ======================= weapons =======================
// level L: damage ×(1 + 0.2(L-1)), speed ×(1 + 0.07(L-1)); upgrade cost = cost × 1.5^(L-1); max level 10
const MAX_LV = 10;
const MAINS = {
  rifle:   { name: "Scrap rifle",  c: "#ffc857", unlock: 0, cost: 40, tag: "Steady, long reach",
             st: (m, r) => ({ dmg: 12 * m, rate: 2.6 * r, range: 250, pel: 1, spread: 0, pierce: 0, knock: 0, mag: 10, rel: 1.5, hm: 2.5 }) },
  shotgun: { name: "Pump shotgun", c: "#ff8a3d", unlock: 1, cost: 45, tag: "6 pellets, knocks back, short reach",
             st: (m, r) => ({ dmg: 6 * m, rate: 1.2 * r, range: 140, pel: 6, spread: 0.2, pierce: 0, knock: 7, mag: 6, rel: 1.9, hm: 2 }) },
  smg:     { name: "Rust SMG",     c: "#7fd1ff", unlock: 2, cost: 45, tag: "Very fast, weak against armour",
             st: (m, r) => ({ dmg: 4.4 * m, rate: 9 * r, range: 185, pel: 1, spread: 0.035, pierce: 0, knock: 0, mag: 32, rel: 2.1, hm: 2.5 }) },
  sniper:  { name: "Rail sniper",  c: "#e0b0ff", unlock: 4, cost: 55, tag: "Huge hits, pierces 3, whole field",
             st: (m, r) => ({ dmg: 64 * m, rate: 0.62 * r, range: 340, pel: 1, spread: 0, pierce: 2, knock: 3, mag: 5, rel: 2.3, hm: 3 }) },
};
const SUPS = {
  mg:     { name: "Sentry MG",   c: "#ffd166", unlock: 0, cost: 35, tag: "Auto-turret on the nearest enemy (hits birds)",
            st: (m, r) => ({ dmg: 4.6 * m, rate: 4.5 * r, range: 215 }) },
  wire:   { name: "Razor wire",  c: "#cfc6ba", unlock: 0, cost: 30, tag: "Slows and cuts the ground in front of the wall",
            st: (m, r, L) => ({ slow: Math.min(0.66, 0.4 + 0.03 * (L - 1)), dps: 3.2 * m, len: 58 }) },
  mortar: { name: "Mortar",      c: "#ff7043", unlock: 1, cost: 40, tag: "Shells the biggest group on the ground",
            st: (m, r) => ({ dmg: 30 * m, cd: 3.8 / r, rad: 24 }) },
  mines:  { name: "Mine layer",  c: "#ef5350", unlock: 2, cost: 40, tag: "Lays mines in their path (ground)",
            st: (m, r, L) => ({ dmg: 42 * m, cd: 4.2 / r, rad: 22, max: 3 + Math.floor((L - 1) / 2) }) },
  tesla:  { name: "Tesla coil",  c: "#6fe3ff", unlock: 3, cost: 45, tag: "Chain lightning, ignores armour and shields",
            st: (m, r, L) => ({ dmg: 15 * m, cd: 1.8 / r, jumps: 4 + Math.floor((L - 1) / 2), range: 165 }) },
  repair: { name: "Repair bot",  c: "#8ee07a", unlock: 4, cost: 40, tag: "Welds the wall while you fight",
            st: (m) => ({ hps: 1.8 * m }) },
  flame:  { name: "Flame vent",  c: "#ffab40", unlock: 5, cost: 45, tag: "Burns the ground at the wall, ignores armour",
            st: (m) => ({ dps: 18 * m, len: 44 }) },
  drone:  { name: "Hunter drone", c: "#b0bec5", unlock: 6, cost: 50, tag: "Hunts the toughest enemy (hits birds)",
            st: (m, r) => ({ dmg: 7.5 * m, rate: 3 * r }) },
};
// abilities: always with you once unlocked; you aim them (key, then where: the mouse, or a tap)
const ABIL = {
  grenade:   { key: "Q", name: "Frag grenade", c: "#ff7043", unlock: 0, cost: 40, tag: "Big splash where you aim (ground)",
               st: (m, r) => ({ dmg: 55 * m, rad: 26, cd: 11 / r }) },
  barricade: { key: "W", name: "Barricade",    c: "#c9a46a", unlock: 2, cost: 40, tag: "They must smash it first (leapers jump it)",
               st: (m, r) => ({ hp: 90 * m, cd: 18 / r }) },
  flare:     { key: "E", name: "Stun flare",   c: "#fff27a", unlock: 4, cost: 45, tag: "Stuns all near it; birds drop to the ground",
               st: (m, r, L) => ({ stun: 2.2 + 0.15 * (L - 1), rad: 42, cd: 16 / r }) },
};
const WPN = { ...MAINS, ...SUPS, ...ABIL };
const lvM = (L) => 1 + 0.2 * (L - 1), lvR = (L) => 1 + 0.07 * (L - 1);
const upCost = (id) => Math.round((id === "wall" ? 50 : WPN[id].cost) * Math.pow(1.5, lv(id) - 1));

// ======================= the horde =======================
// lean / bulk: body shape (the head is where you aim for a headshot)
const EN = {
  walker:   { name: "Shambler",     hp: 30,  spd: 14, armor: 0, dps: 4,  rew: 3,  h: 18, r: 4,  lean: 1.2, bulk: 1,   col: "#7d8f63", cloth: "#4a3f35", tip: "Slow, comes in numbers." },
  runner:   { name: "Runner",       hp: 16,  spd: 31, armor: 0, dps: 3,  rew: 2,  h: 16, r: 4,  lean: 4,   bulk: 0.9, col: "#a7b36c", cloth: "#5a3a30", tip: "Fast: keep the wire and the sentry on the front." },
  rat:      { name: "Mutant rats",  hp: 7,   spd: 38, armor: 0, dps: 1.5, rew: 1, h: 5,  r: 3,  col: "#8a6d57", pack: 3, tip: "Packs of 3: splash beats them (grenade, mortar, mines, tesla, shotgun)." },
  crow:     { name: "Carrion crows", hp: 9,  spd: 34, armor: 0, dps: 2,  rew: 2,  h: 4,  r: 3,  col: "#2a2a30", air: true, pack: 4, tip: "Fly over everything on the ground: only guns, the tesla and the drone hit them. A flare drops them." },
  armored:  { name: "Riot husk",    hp: 62,  spd: 11, armor: 6, dps: 7,  rew: 6,  h: 19, r: 5,  lean: 1,   bulk: 1.2, col: "#7d8f63", cloth: "#7c858e", tip: "Armour 6 cuts every hit by 6: headshots, sniper, grenade, tesla or fire." },
  shield:   { name: "Shield bearer", hp: 50, spd: 12, armor: 0, dps: 5,  rew: 6,  h: 19, r: 5,  lean: 1,   bulk: 1.1, col: "#8a9a6a", cloth: "#4a4038", shield: true, tip: "The shield stops body shots (85%): aim for the head over it, or use splash / tesla / fire." },
  spitter:  { name: "Spitter",      hp: 26,  spd: 16, armor: 0, dps: 0,  rew: 5,  h: 17, r: 4,  lean: 2,   bulk: 1,   col: "#8fbf3a", cloth: "#3e4a2a", ranged: true, tip: "Stops far away and spits at the wall: long reach or a grenade." },
  leaper:   { name: "Leaper",       hp: 24,  spd: 22, armor: 0, dps: 5,  rew: 5,  h: 16, r: 4,  lean: 3,   bulk: 0.9, col: "#c0a07a", cloth: "#5a2a24", leap: true, tip: "Jumps over the wire and your barricade: shoot it in the air (a clean headshot) or stun it." },
  bloater:  { name: "Bloater",      hp: 55,  spd: 12, armor: 0, dps: 0,  rew: 5,  h: 20, r: 7,  col: "#b8b25a", tip: "Bursts at the wall (30). Splits into rats when killed: finish it far away." },
  screamer: { name: "Screamer",     hp: 40,  spd: 12, armor: 0, dps: 3,  rew: 8,  h: 18, r: 4,  lean: 1.5, bulk: 1,   col: "#d8c8b8", cloth: "#6a2030", aura: true, tip: "Makes everything around it 45% faster: kill it first (tap-hold to aim)." },
  saboteur: { name: "Saboteur",     hp: 28,  spd: 27, armor: 0, dps: 0,  rew: 6,  h: 15, r: 4,  lean: 3.5, bulk: 0.85, col: "#a0a890", cloth: "#2a3a2a", sabo: true, tip: "Runs to the wall and knocks out a support weapon for 8 s." },
  brute:    { name: "Brute",        hp: 820, spd: 8,  armor: 4, dps: 22, rew: 90, h: 36, r: 10, lean: 2.5, bulk: 2.1, col: "#9a4a3a", cloth: "#3a2a24", boss: true, tip: "Boss: armour 4, smashes the wall. Headshots, grenades, flare, Overdrive." },
};

// ======================= stages =======================
const STAGES = [
  { name: "Ruined Suburb",   sky: ["#3b2626", "#c06a3a"], ground: ["#5a4432", "#2a2019"], ruin: "#2c1f1a", pool: { walker: 6, runner: 2 } },
  { name: "Dead Highway",    sky: ["#2e2833", "#b0704a"], ground: ["#4c4440", "#221e1c"], ruin: "#261f24", pool: { walker: 5, runner: 3, rat: 3, crow: 1 } },
  { name: "Flooded Mall",    sky: ["#1f2a30", "#6f8a86"], ground: ["#3a4442", "#1a2020"], ruin: "#18211f", pool: { walker: 4, runner: 3, rat: 2, armored: 2, shield: 2, crow: 1 } },
  { name: "Rail Yard",       sky: ["#2a2220", "#9a5e3a"], ground: ["#4a3a30", "#231a15"], ruin: "#201815", pool: { walker: 4, runner: 3, rat: 2, armored: 2, shield: 2, spitter: 2, leaper: 2, crow: 1 } },
  { name: "Reactor Gate",    sky: ["#1a2418", "#7a9a3a"], ground: ["#3a4230", "#1a1f15"], ruin: "#141a10", pool: { walker: 3, runner: 3, rat: 2, armored: 2, shield: 2, spitter: 2, leaper: 2, bloater: 2, crow: 2, saboteur: 1 } },
  { name: "Ash Fields",      sky: ["#302c2a", "#9a948c"], ground: ["#55504a", "#26231f"], ruin: "#24211e", pool: { walker: 3, runner: 3, rat: 2, armored: 3, shield: 2, spitter: 2, leaper: 2, bloater: 2, crow: 2, saboteur: 1, screamer: 1 } },
  { name: "Old Harbor",      sky: ["#1c2430", "#5a7a90"], ground: ["#3a4048", "#1a1d22"], ruin: "#161b22", pool: { walker: 2, runner: 4, rat: 2, armored: 3, shield: 3, spitter: 2, leaper: 3, bloater: 2, crow: 3, saboteur: 1, screamer: 1 } },
  { name: "Radio Tower",     sky: ["#2a1a2a", "#a8505e"], ground: ["#4a3440", "#22171d"], ruin: "#1e1219", pool: { walker: 2, runner: 3, rat: 2, armored: 4, shield: 3, spitter: 3, leaper: 3, bloater: 2, crow: 3, saboteur: 2, screamer: 2 } },
  { name: "Crater City",     sky: ["#2a1810", "#cc5a1e"], ground: ["#5a3420", "#26160d"], ruin: "#22120a", pool: { walker: 2, runner: 3, rat: 3, armored: 4, shield: 3, spitter: 3, leaper: 3, bloater: 3, crow: 3, saboteur: 2, screamer: 2 } },
  { name: "The Last Bridge", sky: ["#140f14", "#6a2e40"], ground: ["#3a2a30", "#170f13"], ruin: "#100a0e", pool: { walker: 2, runner: 3, rat: 3, armored: 4, shield: 4, spitter: 3, leaper: 3, bloater: 3, crow: 3, saboteur: 2, screamer: 2 }, boss: true },
];
const stageDef = (s) => STAGES[Math.min(s, STAGES.length) - 1];
const isBossStage = (s) => s % 5 === 0;
const DIFF = { easy: { hp: 0.75, dmg: 0.75, wall: 1.3, name: "Easy" }, normal: { hp: 1, dmg: 1, wall: 1, name: "Normal" }, hard: { hp: 1.3, dmg: 1.25, wall: 1, name: "Hard" } };
// the 3rd star of each stage: a skill challenge
const CHAL = {
  head:    { t: (n) => `${n} headshots`,                      v: (s) => s.head },
  perfect: { t: (n) => `${n} perfect reloads`,                 v: (s) => s.perfect },
  streak:  { t: (n) => `a kill streak of ${n}`,                v: (s) => s.maxStreak },
  boss:    { t: (n) => `kill the boss within ${n} s`,          v: (s) => s.bossTime, low: true },
  nade:    { t: (n) => `${n} kills with one grenade`,          v: (s) => s.nade },
};
const STAGE_CHAL = [["head", 10], ["perfect", 4], ["head", 20], ["streak", 30], ["boss", 40], ["perfect", 8], ["nade", 4], ["head", 40], ["streak", 60], ["boss", 45]];
const chalOf = (s) => s <= STAGE_CHAL.length ? STAGE_CHAL[s - 1] : ["head", 30 + 5 * s];
function chalDone(s, st) { const [k, n] = chalOf(s), v = CHAL[k].v(st); return CHAL[k].low ? v != null && v <= n : v >= n; }

// ======================= upgrades inside a battle (after each wave: pick 1 of 3) =======================
const PERKS = [
  { id: "hollow",   ic: "▲", name: "Hollow points",  d: "Main weapon damage +25%",               f: (m) => { m.mDmg *= 1.25; } },
  { id: "hands",    ic: "»", name: "Quick hands",    d: "Main weapon fires 20% faster",          f: (m) => { m.mRate *= 1.2; } },
  { id: "barrel",   ic: "━", name: "Long barrel",    d: "Main reach +20%, damage +10%",          f: (m) => { m.mRange *= 1.2; m.mDmg *= 1.1; } },

        P.load.sup = supPref.filter((k) => unlocked(k)).slice(0, supSlots()); while (P.load.sup.length < 3) P.load.sup.push(null);
        for (const t of TAL) if (!P.tal[t.id] && starsFree() >= t.cost) P.tal[t.id] = true;
        const abs = SKILL.ab ? Object.keys(ABIL).filter(unlocked) : [];
        for (let n = 0; n < 60; n++) { const ids = [P.load.main, ...P.load.sup.filter(Boolean), "wall", ...abs].filter((k) => lv(k) < MAX_LV); if (!ids.length) break; const k = ids.reduce((a, c) => upCost(c) < upCost(a) ? c : a); if (P.scrap < upCost(k)) break; P.scrap -= upCost(k); P.lv[k] = lv(k) + 1; }
        r = simBattle(s); tries++;
      } while (!r.win && tries < (opts.tries || 6));
      out.push(opts.short ? `${r.win ? "" : "X"}${tries > 1 ? tries + "t/" : ""}${r.wall}${r.win ? "★" + r.stars : ""}` : `S${s}: ${r.win ? "win" : "LOSS"} try ${tries} wall ${r.wall}% ★${r.stars} lv ${P.load.main}${lv(P.load.main)} ${P.load.sup.filter(Boolean).map((k) => k + lv(k)).join(" ")} wall${lv("wall")} head ${r.st.head} perf ${r.st.perfect}`);
      if (!r.win) break;
    }
    P = JSON.parse(keep); SKILL = { head: 0, perfect: 0, good: 0, ab: false }; return out.join(opts.short ? " " : "\n");
  },
};

requestAnimationFrame(frame);
})();
